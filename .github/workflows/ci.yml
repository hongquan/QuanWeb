on: [push, workflow_dispatch]

name: CI

# Build commands are defined in the project justfile. Keep this workflow in
# sync with the `generate-css` and `build-backend` recipes there.

jobs:
  classify-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changed-backend.outputs.any_changed }}
      ladmin: ${{ steps.changed-ladmin-app.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v7
      - name: Get backend changes
        id: changed-backend
        uses: tj-actions/changed-files@v47.0.6
        with:
          files: |
            **.rs
            **.jinja
            **.yml
            **.toml
            static/css/*.css
            Cargo.lock
          files_ignore: |
            admin/**
            ladmin/**
      - name: Get ladmin app changes
        id: changed-ladmin-app
        uses: tj-actions/changed-files@v47.0.6
        with:
          files: |
            ladmin/**
            **.yml

  build-backend:
    name: quanweb
    needs: classify-changes
    if: needs.classify-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Mirrors `just generate-css`: the backend embeds the generated CSS,
      # so it has to be built first. `css-gen` uses EncreCSS as a library,
      # which removes the need for a separately installed binary.
      - name: Generate CSS
        run: cargo run --bin css-gen

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Mirrors `just build-backend`.
      - name: Build binary
        run: cargo build --release --all-features

      - name: Archive built files
        uses: actions/upload-artifact@v7
        with:
          name: Built binaries
          path: target/release/quanweb

  build-ladmin-app:
    needs: classify-changes
    if: needs.classify-changes.outputs.ladmin == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ladmin
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('ladmin/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - uses: erlef/setup-beam@v1.24.1
        with:
          otp-version: latest
          gleam-version: latest
          rebar3-version: latest
          # elixir-version: "1"
      - name: Add WASM target for Rust
        run: rustup target add wasm32-unknown-unknown
      - name: Download Gleam dependencies
        run: gleam deps download
      - name: Install JS dependencies
        run: bun i
      - name: Build ladmin app
        run: bun run --bun build
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ladmin-built
          path: ladmin/dist

  # Manual full deployment (backend + frontend)
  deploy-backend-ladmin:
    runs-on: ubuntu-latest
    needs: [build-backend, build-ladmin-app]
    if: >
      always() &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') &&
      !failure() &&
      !cancelled() &&
      (needs.build-backend.result == 'success' || needs.build-ladmin-app.result == 'success')
    env:
      ANSIBLE_HOST_KEY_CHECKING: False
    steps:
      - uses: actions/checkout@v7

      - name: Download backend binary
        uses: actions/download-artifact@v8
        with:
          name: Built binaries
          path: Deployment/backend-binary
        id: download_backend
        continue-on-error: true

      - name: Download LAdmin built artifact
        uses: actions/download-artifact@v8
        with:
          name: ladmin-built
          path: Deployment/ladmin-built
        id: download_ladmin
        continue-on-error: true
        
      - name: Install Cowsay
        run: sudo apt-get install cowsay
        if: steps.download_backend.outcome == 'success' || steps.download_ladmin.outcome == 'success'
        
      - name: Install SSH priv key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
        if: steps.download_backend.outcome == 'success' || steps.download_ladmin.outcome == 'success'
        
      - name: Run Ansible playbook
        run: |
          ansible-playbook \
            -i Deployment/Ansible/inventory.yml \
            Deployment/Ansible/playbook.yml \
            --limit prod \
            -u ${{ vars.SERVER_USERNAME }}
        env:
          ANSIBLE_CALLBACKS_ENABLED: profile_tasks
        if: steps.download_backend.outcome == 'success' || steps.download_ladmin.outcome == 'success'
